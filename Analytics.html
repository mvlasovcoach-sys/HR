<!doctype html><html lang="en"><head>
<base href="./">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SPA2099 HR Health — Analytics</title>
<link rel="preload" href="./assets/fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./shared/tokens.css">
<link rel="stylesheet" href="./shared/fonts.css">
<link rel="stylesheet" href="./shared/components.css">
<link rel="stylesheet" href="./shared/charts.css">
<link rel="stylesheet" href="./shared/styles.css">
<script defer src="./assets/js/api.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/i18n.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/team-filter.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/version.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/site.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/nav.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/app-shell.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/date-controls.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/caption.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/lazy-charts.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/guard.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/analytics.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/about.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/exporter.js?v=2025.10.19-05"></script>
<script type="module" src="./assets/js/data-loader.js?v=2025.10.25-01"></script>
<script defer src="./assets/js/auth.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/guards.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/theme.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/sources.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/source-badge.js?v=2025.10.19-05"></script>
<script type="module" src="./assets/js/stress.overview.js?v=2025.10.25-01"></script>
</head><body>
<div class="page">
    <nav id="side-nav" class="sidebar"></nav>
  <main class="main main--analytics">
    <div id="app-topbar" class="card card--topbar">
      <div class="topbar-left">
        <div class="toolbar">
          <div class="toolbar__title">
            <h1 class="header__title" data-i18n="header.analytics">Analytics</h1>
          </div>
          <div class="toolbar__filters">
            <div id="team-filter" class="toolbar__filter"></div>
            <div id="date-controls" class="toolbar__filter"></div>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <div id="lang-switch" class="lang-switch"></div>
        <button class="header__icon" type="button" data-about-open
          data-i18n="ui.about" data-i18n-attr="aria-label">i</button>
      </div>
    </div>
    <div id="global-caption"></div>
    <section class="card chart-card analytics-tracker" id="analytics-tracker-panel" data-source-id="demo-synth-2025">
      <div class="card__header">
        <h2 class="card__title">
          <span data-i18n="analytics.tracker">Wellbeing score (MA7)</span>
        </h2>
        <div class="trk-controls">
          <span id="trk-delta" class="delta-badge" aria-live="polite"></span>
          <label class="switch">
            <input id="maToggle" type="checkbox">
            <span data-i18n="label.movingAverage">MA(3)</span>
          </label>
          <button class="btn-link x-expand" aria-label="Expand chart">Expand</button>
          <button class="src-info" type="button" aria-haspopup="dialog" aria-expanded="false"
            data-i18n="source.link" data-i18n-attr="aria-label" aria-label="Data source &amp; methodology">i</button>
        </div>
      </div>
      <div class="card__body chart-card__body">
        <div class="chart-legend" id="wellbeing-legend"></div>
        <div id="wlb-chart" class="analytics-chart hero-chart chart-host" role="img" aria-live="polite" data-mount="renderAnalyticsPage"></div>
      </div>
      <div class="mini-kpis" id="analytics-mini-kpis" aria-live="polite"></div>
      <div class="card__footer note note--meta" id="trk-meta"></div>
    </section>
    <section class="card analytics-breakdown">
      <header class="card__header">
        <div class="card__subtitle" data-i18n="section.breakdowns">Risk Breakdown</div>
      </header>
      <div class="card__body">
        <div class="breakdown-grid" id="analytics-breakdown" aria-live="polite"></div>
      </div>
    </section>
    <section class="card card--stress panel--stress" data-stats="true" data-source-id="demo-synth-2025">
      <div class="so-skeleton" aria-hidden="true">
        <div class="skeleton__line skeleton__line--wide"></div>
        <div class="skeleton__line skeleton__line--mid"></div>
        <div class="skeleton__block"></div>
      </div>
      <header class="card__header so-head">
        <h2 class="card__title" data-i18n="stress.title">Emotional wellbeing</h2>
        <nav class="tabs" data-i18n="stress.range" data-i18n-attr="aria-label" aria-label="Time range">
          <div class="tabs__list" role="tablist">
            <button role="tab" data-range="day"   class="tabs__trigger is-active"  data-i18n="range.day" aria-selected="true" tabindex="0">Day</button>
            <button role="tab" data-range="week"  class="tabs__trigger"            data-i18n="range.week" aria-selected="false" tabindex="-1">Week</button>
            <button role="tab" data-range="month" class="tabs__trigger"            data-i18n="range.month" aria-selected="false" tabindex="-1">Month</button>
            <button role="tab" data-range="year"  class="tabs__trigger"            data-i18n="range.year" aria-selected="false" tabindex="-1">Year</button>
          </div>
        </nav>
        <button class="src-info" type="button" aria-haspopup="dialog" aria-expanded="false"
                data-i18n="source.link" data-i18n-attr="aria-label" aria-label="Data source & methodology">i</button>
      </header>

      <div class="so-meta">
        <div class="so-range">
          <div class="so-range__value"><span id="so-range">—</span></div>
          <div class="so-range__label" data-i18n="stress.range">Range</div>
        </div>
        <div class="so-last">
          <div class="so-last__value"><span id="so-last">—</span> <span id="so-state" class="pill pill--state">—</span></div>
          <div class="so-last__label" data-i18n="stress.updated">Last updated</div>
          <div class="so-last__time" id="so-updated">—:—</div>
          <div class="so-sample" id="stress-sample">n=—</div>
        </div>
      </div>

      <div class="chart-host chart-host--bars" id="so-chart" tabindex="0" data-i18n="stress.chartAria" data-i18n-attr="aria-label" aria-label="Emotional wellbeing distribution chart"></div>

      <div class="so-legend legend legend--inline">
        <span><i class="dot dot--low"></i><span data-i18n="stress.low">Low</span></span>
        <span><i class="dot dot--normal"></i><span data-i18n="stress.normal">Normal</span></span>
        <span><i class="dot dot--moderate"></i><span data-i18n="stress.moderate">Moderate</span></span>
        <span><i class="dot dot--high"></i><span data-i18n="stress.high">High</span></span>
      </div>

      <div class="so-switch">
        <div class="seg" role="group" data-i18n="stress.metricGroup" data-i18n-attr="aria-label" aria-label="Metric">
          <button class="seg__btn is-active" data-metric="emotion"  data-i18n="stress.emotion">Emotion</button>
          <button class="seg__btn"           data-metric="stress"   data-i18n="stress.stress">Stress</button>
        </div>
        <div class="so-actions">
          <button class="btn btn--ghost" data-i18n="stress.test">Stress test</button>
          <button class="btn btn--ghost" data-i18n="stress.calibrate">Calibrate</button>
        </div>
      </div>

      <div class="panel__meta note note--meta" id="so-meta-line"></div>
      <div class="so-low" id="so-low" role="status" aria-live="polite" hidden>Low sample size</div>
    </section>
  </main>
</div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const t = (key, fallback) => window.I18N?.t?.(key) || fallback;
      const periodLabel = () => {
        const raw = (() => {
          try {
            return localStorage.getItem('hr:range');
          } catch (err) {
            return null;
          }
        })();
        if (!raw) return t('range.7d', '7 Days');
        try {
          const parsed = JSON.parse(raw);
          const preset = String(parsed?.preset || '').toLowerCase();
          const key = preset === 'today' || preset === 'day'
            ? 'today'
            : preset === 'mtd' || preset === 'month'
              ? 'mtd'
              : preset === 'qtd' || preset === 'quarter'
                ? 'qtd'
                : preset === 'ytd' || preset === 'year'
                  ? 'ytd'
                  : '7d';
          return t(`range.${key}`, '7 Days');
        } catch (err) {
          return t('range.7d', '7 Days');
        }
      };
      const teamLabel = () => {
        let team = 'all';
        try {
          team = localStorage.getItem('hr:team') || 'all';
        } catch (err) {
          team = 'all';
        }
        if (!team || team === 'all') return t('caption.teamAll', 'All Teams');
        try {
          const map = JSON.parse(localStorage.getItem('hr:team:names') || 'null');
          if (map && map[team]) return map[team];
        } catch (err) {
          /* noop */
        }
        return team;
      };
      const captionInsight = () => {
        const prefix = (() => {
          try {
            return localStorage.getItem('hr:scenario') === 'night'
              ? t('caption.scenarioPrefix', 'Night-Shift Scenario · ')
              : '';
          } catch (err) {
            return '';
          }
        })();
        const base = `${t('caption.orgAvg', 'Org avg')} • ${periodLabel()} • ${teamLabel()}`;
        return `${prefix}${base}`;
      };

      const renderCaption = () => {
        window.Caption?.render?.('#global-caption', {
          asOf: new Date(),
          insight: captionInsight()
        });
      };

      renderSideNav('analytics');
      window.DateControls?.mount('#date-controls', {
        presets: ['Today', '7D', 'MTD', 'QTD', 'YTD'],
        compare: true
      });
      renderCaption();
      document.addEventListener('i18n:change', renderCaption);
      window.addEventListener('storage', event => {
        if (!event) return;
        if (event.key === 'hr:range' || event.key === 'hr:team' || event.key === 'hr:scenario') {
          renderCaption();
        }
      });
      window.StressOverview?.mount('so-chart', 'day');
    });
  </script>
</body></html>
