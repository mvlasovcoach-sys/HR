<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link rel="stylesheet" href="./assets/css/ui.tokens.css?v=2025.10.19-03">

<link rel="stylesheet" href="./assets/css/corporate.css?v=2025.10.19-03">

<script defer src="./assets/js/i18n.js?v=2025.10.19-03"></script>
<script defer src="./assets/js/version.js?v=2025.10.19-03"></script>
<script defer src="./assets/js/site.js?v=2025.10.19-03"></script>
<script defer src="./assets/js/nav.js?v=2025.10.19-03"></script>
<script defer src="./assets/js/app-shell.js?v=2025.10.19-03"></script>
<script defer src="./assets/js/date-controls.js?v=2025.10.19-03"></script>
<script defer src="./assets/js/team-filter.js?v=2025.10.19-03"></script>
<script defer src="./assets/js/guard.js?v=2025.10.19-03"></script>
<script defer src="./assets/js/analytics.js?v=2025.10.19-03"></script>
<script defer src="./assets/js/about.js?v=2025.10.19-03"></script>
<script defer src="./assets/js/exporter.js?v=2025.10.19-03"></script>

</head><body>
<div class="page">
    <nav id="side-nav" class="sidebar"></nav>
  <main class="main main--analytics">
    <div id="app-topbar">
      <div class="topbar-left">
        <div class="header header--analytics">
          <h1 class="header__title" data-i18n="header.analytics">Analytics</h1>
          <div class="header__actions">
            <div id="team-filter" class="team-filter"></div>
            <div id="date-controls"></div>
            <button class="header__icon" type="button" data-about-trigger data-i18n="aria.about" data-i18n-attr="aria-label" aria-label="About"></button>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <div id="lang-switch" class="lang-switch"></div>
      </div>
    </div>
    <p id="analytics-caption" class="header__caption" aria-live="polite"></p>
    <section class="analytics-tracker">
      <div class="panel chart-card" id="analytics-tracker-panel">
        <div class="panel__head">
          <span data-i18n="section.wellbeingTracker">Wellbeing Score Tracker</span>
          <span id="wellbeing-delta" class="delta-badge" aria-live="polite"></span>
          <label class="switch">
            <input id="maToggle" type="checkbox">
            <span data-i18n="label.movingAverage">MA(3)</span>
          </label>
          <button class="btn-link x-expand" aria-label="Expand chart">Expand</button>
        </div>
        <div class="panel__body analytics-tracker__body">
          <div class="tracker-legend" id="wellbeing-legend"></div>
          <div id="wlb-chart" class="analytics-chart hero-chart" role="img" aria-live="polite"></div>
        </div>
        <div class="mini-kpis" id="analytics-mini-kpis" aria-live="polite"></div>
      </div>
    </section>
    <section class="panel analytics-breakdown">
      <div class="panel__meta" data-i18n="section.breakdowns">Risk Breakdown</div>
      <div class="breakdown-grid" id="analytics-breakdown" aria-live="polite"></div>
    </section>
  </main>
</div>
  <script>document.addEventListener('DOMContentLoaded',()=>renderSideNav('analytics'));</script>
</body></html>
