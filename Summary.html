<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SPA2099 HR Health Redirect</title>
    <script>
      (function redirectAway() {
        try {
          const params = new URLSearchParams(window.location.search);
          const mode = (params.get('mode') || 'demo').toLowerCase();
          const sanitized = mode.replace(/[^a-z0-9_-]/gi, '') || 'demo';
          const safeMode = encodeURIComponent(sanitized);
          window.location.replace(`Corporate.html?mode=${safeMode}`);
        } catch (err) {
          window.location.replace('Corporate.html');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p>
        The original dashboard is no longer available. Please visit
        <a href="Corporate.html">Corporate.html</a> for the current experience.
      </p>
    </noscript>
  </body>
</html>
