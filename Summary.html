<!doctype html><html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SPA2099 HR Health — Summary</title>
<link rel="stylesheet" href="./assets/css/app-shell.css?v=${APP_VERSION}">
<link rel="stylesheet" href="./assets/css/app.css?v=${APP_VERSION}">
<link rel="stylesheet" href="./assets/css/ui.tokens.css?v=${APP_VERSION}">
<link rel="stylesheet" href="./assets/css/ui.components.css?v=${APP_VERSION}">
<!-- optional page CSS -->
<link rel="stylesheet" href="./assets/css/hr-board.neon.css?v=${APP_VERSION}">
<link rel="stylesheet" href="./assets/css/summary.css?v=${APP_VERSION}">
<script defer src="./assets/js/i18n.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/version.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/site.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/nav.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/app-shell.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/config.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/date-controls.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/team-filter.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/guard.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/summary.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/summary.legend.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/about.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/exporter.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/data-loader.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/auth.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/guards.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/theme.js?v=${APP_VERSION}"></script>
<script defer src="./assets/js/hr-board.neon.js?v=${APP_VERSION}"></script>
</head><body>
<div class="page">
    <nav id="side-nav" class="sidebar"></nav>
  <main class="main">
    <div class="header">
      <div class="header__title" data-i18n="header.summary">Summary</div>
      <div class="header__badges" aria-hidden="true">
        <span class="pill pill--neutral" data-i18n="badge.aggregatesOnly">AGGREGATES ONLY</span>
        <span class="pill pill--neutral" data-i18n="badge.noBiosignals">NO RAW BIOSIGNALS</span>
        <span class="pill pill--neutral" data-i18n="badge.fixedThresholds">FIXED THRESHOLDS</span>
        <span class="pill pill--neutral" data-i18n="badge.noMl">NO ML</span>
      </div>
      <button id="btn-legend" class="icon-btn" aria-haspopup="dialog" title="Legend">i</button>
      <div class="header__actions">
        <div id="team-filter" class="team-filter"></div>
        <div id="date-controls"></div>
        <button class="header__icon" type="button" data-about-trigger data-i18n="aria.about" data-i18n-attr="aria-label" aria-label="About"></button>
      </div>
    </div>
    <div class="page-subhead">
      <span id="period-label"></span>
      <span id="asof-label" class="muted"></span>
    </div>
    <span id="org-badge" class="pill" hidden></span>
    <div id="demo-banner" class="banner banner--demo" hidden></div>
    <p id="global-caption" class="header__caption" aria-live="polite"></p>
    <div class="scenario-controls" role="group" data-i18n="aria.scenario" data-i18n-attr="aria-label" aria-label="Scenario toggles">
      <button type="button" id="btn-night-scenario" class="btn btn--ghost" data-i18n="summary.applyDemo">Apply Night-Shift Demo</button>
      <button type="button" id="btn-night-reset" class="btn btn--ghost" data-i18n="ui.returnLive">Return to Live View</button>
    </div>
    <div id="sum-kpi-grid" class="grid grid-4"></div>
    <div id="sum-toast" class="toast" aria-live="polite" role="status" hidden></div>
    <section id="hr-board" class="panel" aria-live="polite"></section>
  </main>
</div>
  <script>document.addEventListener('DOMContentLoaded',()=>renderSideNav('summary'));</script>
</body></html>
