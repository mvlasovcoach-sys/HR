</head><body>
<div class="page">
    <nav id="side-nav" class="sidebar"></nav>
  <main class="main">
    <div id="app-topbar">
      <div class="topbar-left">
        <div class="toolbar">
          <div class="toolbar__title">
            <h1 class="header__title" data-i18n="header.summary">Summary</h1>
            <button id="btn-legend" class="header__icon" type="button"
                    aria-haspopup="dialog" aria-expanded="false"
                    data-i18n="ui.legend" data-i18n-attr="aria-label,title"
                    title="Legend" aria-label="Legend">i</button>
          </div>
          <div class="toolbar__filters">
            <div id="team-filter" class="toolbar__filter team-filter"></div>
            <div id="date-controls" class="toolbar__filter"></div>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <div id="lang-switch" class="lang-switch"></div>
        <button class="header__icon" type="button" data-about-open
                data-i18n="ui.about" data-i18n-attr="aria-label"
                aria-label="About">i</button>
      </div>
    </div>
    <div class="page-subhead">
      <span id="period-label"></span>
      <span id="asof-label" class="muted"></span>
    </div>
    <span id="org-badge" class="pill" hidden></span>
    <div id="demo-banner" class="banner banner--demo" hidden>
      <span data-i18n="summary.demoActive">Demo scenario active — simulated night-shift data</span>
      <a id="btn-return-live" href="#" class="link-quiet" data-i18n="summary.return">Return to live</a>
    </div>
    <div id="global-caption" class="header__caption" aria-live="polite"></div>
    <div class="scenario-controls" role="group" data-i18n="aria.scenario" data-i18n-attr="aria-label" aria-label="Scenario toggles">
      <button type="button" id="btn-night-scenario" class="btn btn--ghost" data-i18n="summary.applyDemo">Apply Night-Shift Demo</button>
      <button type="button" id="btn-night-reset" class="btn btn--ghost" data-i18n="ui.returnLive">Return to Live View</button>
    </div>
    <div id="sum-toast" class="toast" aria-live="polite" role="status" hidden></div>
    <section id="hr-board" class="panel" aria-live="polite" data-mount="renderHrBoard"></section>
  </main>
</div>
  <script>document.addEventListener('DOMContentLoaded',()=>{renderSideNav('summary');window.DateControls?.mount('#date-controls',{presets:['Today','7D','MTD','QTD','YTD'],compare:true});window.Caption?.renderCaption('#global-caption',{asOf:new Date(),insight:window.PageInsight||''});});</script>
</body></html>
