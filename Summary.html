<script defer src="./assets/js/version.js?v=2025.10.19-05"></script>

</head><body>
<div class="page">
  <template id="tpl-kpi">
    <article class="kpi--brand" role="group" aria-labelledby="kpi-title">
      <header class="kpi-head">
        <div id="kpi-title" class="kpi-title"></div>
        <span class="delta same" aria-live="polite">
          <svg aria-hidden="true" viewBox="0 0 10 10"><path/></svg>
          <span class="delta-text">No change</span>
        </span>
      </header>
      <div class="kpi-value">
        <span class="kpi-number num">--</span>
        <span class="kpi-unit"></span>
      </div>
      <svg class="spark" viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true">
        <path class="ci"></path>
        <path class="line"></path>
      </svg>
      <footer class="kpi-footer">
        <span class="updated">Updated</span>
        <span class="pts">0 pts</span>
      </footer>
    </article>
  </template>
    <nav id="side-nav" class="sidebar"></nav>
  <main class="main">
    <div id="app-topbar" class="card card--topbar">
      <div class="page-header">
        <div class="titlebar">
          <div class="left">
            <h1 class="page-title" data-i18n="header.summary">Summary</h1>
            <button id="btn-legend" class="info-dot" type="button"
              aria-haspopup="dialog" aria-expanded="false"
              data-help="summary"
              aria-label="Legend"
              data-i18n="ui.legend" data-i18n-attr="aria-label,title">i</button>
          </div>
        </div>

        <div class="header-controls" role="group" aria-label="Filters">
          <div id="team-filter" class="toolbar__filter"></div>
          <div id="date-controls" class="toolbar__filter"></div>
          <div id="lang-switch" class="lang-switch"></div>
        </div>
      </div>
    </div>
    <section class="card card--context" aria-live="polite">
      <div id="global-caption"></div>
      <div class="page-subhead">
        <span id="period-label"></span>
        <span id="asof-label" class="muted"></span>
      </div>
      <span id="org-badge" class="pill brand-pill range-pill" hidden></span>
      <div id="demo-banner" class="banner banner--demo" hidden>
        <span data-i18n="summary.demoActive">Demo scenario active — simulated night-shift data</span>
        <a id="btn-return-live" href="#" class="brand-btn--primary" data-i18n="summary.return">Return to live</a>
      </div>
      <div class="scenario-controls" role="group" data-i18n="aria.scenario" data-i18n-attr="aria-label">
        <button class="brand-pill range-pill" type="button" data-scenario="night" data-i18n="demo.night">Night-Shift Scenario</button>
        <button class="brand-pill range-pill" type="button" data-scenario="live" data-i18n="demo.live">Return to Live</button>
      </div>
      <div id="sum-toast" class="toast" aria-live="polite" role="status" hidden></div>
    </section>
    <section class="card card--kpi" aria-live="polite">
      <section id="kpi-top" class="kpi-top-grid" aria-live="polite"></section>
    </section>
    <section id="hr-board" class="card chart-card" aria-live="polite" data-mount="renderHrBoard"></section>
  </main>
  <template id="help-summary">
    <div class="help-popover__content">
      <h2 class="help-popover__title" data-i18n="help.summary.title">Summary legend</h2>
      <div class="help-popover__body">
        <p data-i18n="help.summary.lead">Understand how KPIs are calculated for the selected range.</p>
        <ul>
          <li data-i18n="help.summary.delta">Delta chips compare against the previous saved range.</li>
          <li data-i18n="help.summary.spark">Sparklines show a moving average trend—hover for tooltips.</li>
          <li data-i18n="help.summary.scenario">Scenario pills switch between live data and the night-shift simulation.</li>
        </ul>
      </div>
      <button class="brand-pill range-pill help-popover__close" type="button" data-help-close data-i18n="ui.close">Close</button>
    </div>
  </template>
</div>
  <script>document.addEventListener('DOMContentLoaded',()=>{renderSideNav('summary');window.DateControls?.mount('#date-controls',{presets:['Today','7D','MTD','QTD','YTD'],compare:true});window.Caption?.render('#global-caption',{asOf:new Date(),insight:window.PageInsight||''});});</script>
</body></html>
