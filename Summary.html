<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<script defer src="./assets/js/i18n.js?v=2025.10.19-05"></script>

</head><body>
<div class="page">
    <nav id="side-nav" class="sidebar"></nav>
  <main class="main">
    <div id="app-topbar">
      <div class="topbar-left">
        <div class="header summary-toolbar">
          <div class="summary-toolbar__left">
          <div class="summary-toolbar__title-row">
            <h1 class="header__title" data-i18n="header.summary">Summary</h1>
            <button id="btn-legend" class="icon-btn" aria-haspopup="dialog" data-i18n="legend.title" data-i18n-attr="aria-label,title" aria-label="Legend" title="Legend">i</button>
          </div>
            <div class="header__badges" aria-hidden="true">
              <span class="pill pill--neutral" data-i18n="badge.aggregatesOnly">AGGREGATES ONLY</span>
              <span class="pill pill--neutral" data-i18n="badge.noBiosignals">NO RAW BIOSIGNALS</span>
              <span class="pill pill--neutral" data-i18n="badge.fixedThresholds">FIXED THRESHOLDS</span>
              <span class="pill pill--neutral" data-i18n="badge.noMl">NO ML</span>
            </div>
          </div>
          <div class="summary-toolbar__right">
            <div id="lang-switch" class="lang-switch"></div>
            <div class="header__actions">
              <div id="team-filter" class="team-filter"></div>
              <div id="date-controls"></div>
              <button class="header__icon" type="button" data-about-trigger data-i18n="aria.about" data-i18n-attr="aria-label" aria-label="About"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="page-subhead">
      <span id="period-label"></span>
      <span id="asof-label" class="muted"></span>
    </div>
    <span id="org-badge" class="pill" hidden></span>
    <div id="demo-banner" class="banner banner--demo" hidden>
      <span data-i18n="summary.demoActive">Demo scenario active — simulated night-shift data</span>
      <a id="btn-return-live" href="#" class="link-quiet" data-i18n="summary.return">Return to live</a>
    </div>
    <p id="global-caption" class="header__caption" aria-live="polite"></p>
    <div class="scenario-controls" role="group" data-i18n="aria.scenario" data-i18n-attr="aria-label" aria-label="Scenario toggles">
      <button type="button" id="btn-night-scenario" class="btn btn--ghost" data-i18n="summary.applyDemo">Apply Night-Shift Demo</button>
      <button type="button" id="btn-night-reset" class="btn btn--ghost" data-i18n="ui.returnLive">Return to Live View</button>
    </div>
    <section id="summary-kpi-primary" class="grid grid-4 kpi-grid" data-kpi-grid="primary"></section>
    <div id="sum-toast" class="toast" aria-live="polite" role="status" hidden></div>
    <section id="hr-board" class="panel" aria-live="polite"></section>
  </main>
</div>
  <script>document.addEventListener('DOMContentLoaded',()=>renderSideNav('summary'));</script>
</body></html>
