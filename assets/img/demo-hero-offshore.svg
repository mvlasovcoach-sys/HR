<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Stylized offshore platform illustration</title>
  <desc id="desc">Vector illustration showing a futuristic offshore oil platform with helipad and crane in teal and navy colors.</desc>
  <defs>
