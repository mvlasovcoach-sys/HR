<!doctype html><html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SPA2099 HR Health — Demo</title>
<link rel="stylesheet" href="./assets/css/ui.tokens.css?v=2025.10.19-05">
<link rel="stylesheet" href="./assets/css/ui.components.css?v=2025.10.19-05">
<link rel="stylesheet" href="./assets/css/app-shell.css?v=2025.10.19-05">
<link rel="stylesheet" href="./assets/css/nav.css?v=2025.10.19-05">
<link rel="stylesheet" href="./assets/css/app.css?v=2025.10.19-05">
<link rel="stylesheet" href="./assets/css/charts.css?v=2025.10.19-05">
<link rel="stylesheet" href="./assets/css/print.css?v=2025.10.19-05" media="print">
<link rel="stylesheet" href="./assets/css/demo.css?v=2025.10.19-05">
<script defer src="./assets/js/i18n.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/version.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/site.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/nav.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/app-shell.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/date-controls.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/caption.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/lazy-charts.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/team-filter.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/guard.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/guards.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/auth.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/theme.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/exporter.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/demo.js?v=2025.10.19-05"></script>
</head><body>
<div class="page">
    <nav id="side-nav" class="sidebar"></nav>
  <main class="main">
    <div id="app-topbar">
      <div class="topbar-left">
        <div class="toolbar">
          <div class="toolbar__title">
            <h1 class="header__title" data-i18n="demo.title">Demo</h1>
          </div>
          <div class="toolbar__filters">
            <div id="team-filter" class="toolbar__filter team-filter"></div>
            <div id="date-controls" class="toolbar__filter"></div>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <div id="lang-switch" class="lang-switch"></div>
        <button class="header__icon" type="button" data-about-open
                data-i18n="ui.about" data-i18n-attr="aria-label"
                aria-label="About">i</button>
      </div>
    </div>

    <div id="global-caption" class="header__caption" aria-live="polite"></div>
    <span id="site-badge" class="pill" aria-live="polite"></span>

    <section id="demo-hero" class="demo-hero" aria-live="polite"></section>

    <section id="demo-overview" class="grid grid-4 demo-info-grid" aria-live="polite">
      <div id="card-site" class="tile card"></div>
      <div id="card-headcount" class="tile card"></div>
      <div id="card-rotation" class="tile card"></div>
      <div id="card-shifts" class="tile card"></div>
    </section>

    <section id="demo-org" class="panel" aria-live="polite">
      <div class="panel__head" data-i18n="demo.orgStructure">Organization</div>
      <div id="org-table"></div>
    </section>

    <section id="demo-demographics" class="section">

      <article class="card">
        <h3 data-i18n="demo.ageOverall">Age — Overall</h3>
        <div class="chart-block">
          <div id="chart-age-overall" class="chart-root"></div>
        </div>
      </article>

      <article class="card">
        <h3 data-i18n="demo.byDepartment">By Department</h3>
        <div class="chart-block">
          <div id="chart-by-dept" class="chart-root"></div>
        </div>
      </article>

    </section>

    <section id="demo-shifts" class="panel" aria-live="polite">
      <div class="panel__head" data-i18n="demo.shiftPattern">Shift Pattern</div>
      <div id="shift-grid"></div>
    </section>

    <div class="actions">
      <button id="btn-export-brief" class="btn btn--export" data-export-key="demo.exportBrief" data-export-icon="⇩">
        <span class="btn__icon" aria-hidden="true">⇩</span>
        <span class="btn__label" data-i18n="demo.exportBrief">Export Site Brief (PDF)</span>
      </button>
    </div>

    <div id="demo-toast" class="toast" role="status" aria-live="assertive" hidden></div>
  </main>
</div>
  <script>document.addEventListener('DOMContentLoaded',()=>{renderSideNav('demo');window.DateControls?.mount('#date-controls',{presets:['Today','7D','MTD','QTD','YTD'],compare:true});window.Caption?.renderCaption('#global-caption',{asOf:new Date(),insight:window.PageInsight||''});});</script>
</body></html>
