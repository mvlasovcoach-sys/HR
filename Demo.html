  #demo-range {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 8px 0 4px;
  }
  #demo-range .seg-btn {
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--panel-bg, #0f2630);
    color: var(--text-color, #e6f3f7);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

</head><body data-page="demo" data-variant="demo">
<div class="page">
    <nav id="side-nav" class="sidebar"><noscript>
  <ul class="nojs-nav">
    <li><a href="Corporate.html">Corporate</a></li>
    <li><a href="Analytics.html">Analytics</a></li>

  </ul>
</noscript></nav>
  <main class="main main--demo page-wrap page-demo">
    <header class="page-header" data-toolbar-root>
      <demo-toolbar id="demo-toolbar"></demo-toolbar>
    </header>
    <!-- BEGIN subtoolbar -->
    <div class="subtoolbar mt-1">
      <div class="subtoolbar__left"><!-- page slot (например, Team на Corporate) --></div>
      <div class="subtoolbar__right">
        <time class="subtoolbar__asof" data-asof datetime=""></time>
      </div>
    </div>
    <!-- END subtoolbar -->

    <section class="scenario-badge">
      <span class="badge badge--demo">DEMO • AURORA DEEPWATER PLATFORM • 100 STAFF • 24/7</span>
    </section>
    <div id="page-content">
      <div id="global-caption"></div>
      <span id="site-badge" class="pill" aria-live="polite"></span>

      <!-- KPI BLOCK START -->
      <!-- DEMO range switch -->
      <div id="demo-range" class="seg">
        <button data-r="1d" class="seg-btn is-active">Today</button>
        <button data-r="7d" class="seg-btn">7 days</button>
        <button data-r="30d" class="seg-btn">30 days</button>
        <button data-r="mtd" class="seg-btn">Month to date</button>
        <button data-r="qtd" class="seg-btn">Quarter to date</button>
        <button data-r="ytd" class="seg-btn">Year to date</button>
      </div>
      <section class="kpi-cards" id="kpi"></section>
      <!-- KPI BLOCK END -->

      <section id="demo-overview" class="grid grid-4 demo-info-grid" aria-live="polite" data-legacy-kpi>
        <div id="card-site" class="tile card"></div>
        <div id="card-headcount" class="tile card"></div>
        <div id="card-rotation" class="tile card"></div>
        <div id="card-shifts" class="tile card"></div>
      </section>

      <section id="demo-org" class="panel" aria-live="polite">
        <div class="panel__head" data-i18n="demo.orgStructure">Organization</div>
        <div id="org-table"></div>
      </section>

      <section id="demo-demographics" class="section">

        <div class="panel panel--chart" data-stats="true" data-source-id="demo-synth-2025">
          <button class="src-info" type="button" aria-haspopup="dialog" aria-expanded="false"
            data-i18n="source.link" data-i18n-attr="aria-label">i</button>
          <h2 class="panel__title">
            <span data-i18n="demo.age_title">Age — Headcount by band</span>
            <span class="muted">(<span data-i18n="demo.age.unit_people">n</span>=<span id="age-n">0</span>)</span>
          </h2>
          <div class="panel__meta note note--meta" id="age-meta"></div>
          <div class="chart-host chart-host--bar" data-chart="age-overall">
            <div id="chart-age-overall" class="chart-root"></div>
          </div>
          <div class="chart-mini">
            <h3 class="chart-mini__title">
              <span data-i18n="demo.gender_title">Gender — Headcount</span>
              <span class="muted">(<span data-i18n="demo.age.unit_people">n</span>=<span id="gender-n">0</span>)</span>
            </h3>
            <div id="chart-gender-overall" class="chart-mini__root"></div>
          </div>
          <div class="chart-notes" data-note-host="age"></div>
        </div>

        <article class="card panel" data-stats="true" data-source-id="demo-synth-2025">
          <button class="src-info" type="button" aria-haspopup="dialog" aria-expanded="false"
            data-i18n="source.link" data-i18n-attr="aria-label">i</button>
          <h3 data-i18n="demo.byDepartment">By Department</h3>
          <div class="legend legend--inline">
            <span class="legend__item"><i class="dot dot--green"></i><span data-i18n="legend.ok">OK (≥ threshold)</span></span>
            <span class="legend__item"><i class="dot dot--blue"></i><span data-i18n="legend.nok">Not OK (&lt; threshold)</span></span>
          </div>
          <div class="panel__meta note note--meta" id="dept-meta"></div>
          <div class="chart-block">
            <div id="chart-by-dept" class="chart-root"></div>
          </div>
          <div class="chart-notes" data-note-host="dept"></div>
        </article>

      </section>

      <section id="demo-shifts" class="panel" aria-live="polite" data-stats="true" data-source-id="demo-synth-2025">
        <button class="src-info" type="button" aria-haspopup="dialog" aria-expanded="false"
          data-i18n="source.link" data-i18n-attr="aria-label">i</button>
        <div class="panel__head" data-i18n="demo.shiftPattern">Shift Pattern</div>
        <div class="panel__meta note note--meta" id="shift-meta"></div>
        <div id="shift-grid"></div>
      </section>

      <div class="actions">
        <button id="btn-export-brief" class="brand-btn--primary btn--export" data-export-key="demo.exportBrief" data-export-icon="⇩">
          <span class="btn__icon" aria-hidden="true">⇩</span>
          <span class="btn__label" data-i18n="demo.exportBrief">Export Site Brief (PDF)</span>
        </button>
      </div>

      <div id="demo-toast" class="toast" role="status" aria-live="assertive" hidden></div>
    </div>
  </main>
</div>
  <script type="module" src="assets/js/entries/demo.entry.js?v=4"></script>

<div id="ui-portal"></div>
