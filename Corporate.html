<!-- Базовая тема (легаси, не трогаем визуал) -->

<!-- Brand tokens & shared accents -->

<link rel="stylesheet" href="./shared/brand.inputs.css?v=2025-10-26">
<link rel="stylesheet" href="./shared/ui.header.css?v=2025-10-26">
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
<script type="module" src="./assets/js/data-loader.js"></script>
<script defer src="./assets/js/api.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/i18n.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/team-filter.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/version.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/site.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/nav.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/app-shell.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/caption.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/lazy-charts.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/guard.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/corporate.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/about.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/exporter.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/auth.js?v=2025.10.19-05"></script>
<script defer src="./assets/js/guards.js?v=2025.10.19-05"></script>

</head><body>
<div class="page">
    <nav id="side-nav" class="sidebar"></nav>
  <main class="main main--corporate">
    <div class="page-wrap">
      <div id="toolbar"></div>
      <div id="page-content">
        <div id="global-caption"></div>

        <section id="corp-kpis" class="panel">
      <div class="panel__head" data-i18n="section.corporateOverview">Overview KPIs</div>
      <div id="corp-kpi-grid" class="grid grid-4"></div>
    </section>

        <section id="corp-heatmap" class="panel">
      <div class="panel__head">
        <span data-i18n="section.corporateHeatmap">Divisional Heatmap</span>
        <span class="legend" aria-hidden="true">
          <span><i class="sw red"></i><span data-i18n="legend.low">≤55 red</span></span>
          <span><i class="sw amber"></i><span data-i18n="legend.mid">56–69 amber</span></span>
          <span><i class="sw green"></i><span data-i18n="legend.high">≥70 green</span></span>
        </span>
      </div>
      <div id="heatmap-grid"></div>
    </section>

        <section id="corp-events" class="panel">
      <div class="panel__head">
        <span data-i18n="section.corporateEvents">Detected Events</span>
        <div class="event-badges" id="event-badges" aria-live="polite">
          <span class="pill pill--neutral" id="ev-count"></span>
          <span class="pill pill--critical" id="ev-crit"></span>
          <span class="pill pill--caution" id="ev-warn"></span>
          <span class="pill pill--neutral" id="ev-info"></span>
        </div>
        <div class="filters">
          <label class="visually-hidden" for="f-team" data-i18n="events.filter.teamAll">All teams</label>
          <select id="f-team" multiple></select>
          <label class="visually-hidden" for="f-sev" data-i18n="events.filter.severityAll">All severities</label>
          <select id="f-sev"></select>
          <label class="visually-hidden" for="f-type" data-i18n="events.filter.typeAll">All types</label>
          <select id="f-type"></select>
        </div>
      </div>
      <div id="events-list"></div>
    </section>

        <section id="corp-activity" class="panel">
      <div class="panel__head">
        <span data-i18n="section.corporateActivity">Activity Log</span>
        <button id="export-activity" class="brand-btn--primary btn--export" data-export-key="ui.exportCSV" data-export-icon="⇩">
          <span class="btn__icon" aria-hidden="true">⇩</span>
          <span class="btn__label" data-i18n="ui.exportCSV">Export CSV</span>
        </button>
      </div>
      <table id="activity-table" class="table"></table>
      <div id="activity-cards" class="table-cards" aria-live="polite"></div>
    </section>
      </div>
    </div>
  </main>
</div>
  <script>document.addEventListener('DOMContentLoaded',()=>{renderSideNav('corporate');window.Caption?.render('#global-caption',{asOf:new Date(),insight:window.PageInsight||''});});</script>
</body></html>
