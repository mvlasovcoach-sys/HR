</head><body>
<div class="page">
    <nav id="side-nav" class="sidebar"></nav>
  <main class="main main--corporate page-wrap">
      <div id="toolbar"></div>
      <div id="page-content">
        <div id="global-caption"></div>

        <section id="corp-kpis" class="panel">
      <div class="panel__head" data-i18n="section.corporateOverview">Overview KPIs</div>
      <div id="corp-kpi-grid" class="grid grid-4"></div>
    </section>

        <section id="corp-heatmap" class="panel">
      <div class="panel__head">
        <span data-i18n="section.corporateHeatmap">Divisional Heatmap</span>
        <span class="legend" aria-hidden="true">
          <span><i class="sw red"></i><span data-i18n="legend.low">≤55 red</span></span>
          <span><i class="sw amber"></i><span data-i18n="legend.mid">56–69 amber</span></span>
          <span><i class="sw green"></i><span data-i18n="legend.high">≥70 green</span></span>
        </span>
      </div>
      <div id="heatmap-grid"></div>
    </section>

        <section id="corp-events" class="panel">
      <div class="panel__head">
        <span data-i18n="section.corporateEvents">Detected Events</span>
        <div class="event-badges" id="event-badges" aria-live="polite">
          <span class="pill pill--neutral" id="ev-count"></span>
          <span class="pill pill--critical" id="ev-crit"></span>
          <span class="pill pill--caution" id="ev-warn"></span>
          <span class="pill pill--neutral" id="ev-info"></span>
        </div>
      </div>
      <div id="events-list"></div>
    </section>

        <section id="corp-activity" class="panel">
      <div class="panel__head">
        <span data-i18n="section.corporateActivity">Activity Log</span>
        <button id="export-activity" class="brand-btn--primary btn--export" data-export-key="ui.exportCSV" data-export-icon="⇩">
          <span class="btn__icon" aria-hidden="true">⇩</span>
          <span class="btn__label" data-i18n="ui.exportCSV">Export CSV</span>
        </button>
      </div>
      <table id="activity-table" class="table"></table>
      <div id="activity-cards" class="table-cards" aria-live="polite"></div>
    </section>
      </div>
  </main>
</div>
  <script type="module" src="assets/js/stores/modeStore.js?v=2025-11-02-1"></script>
  <script type="module" src="assets/js/components/Toolbar.js?v=2025-11-02-1"></script>
  <!-- страничный js ниже -->
  <script type="module" src="./assets/js/pages/corporate.js?v=2025.10.19-05"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderSideNav('corporate');
      window.DateControls?.mount('#rangeSwitch', {
        presets: ['Today', '7D', 'MTD', 'QTD', 'YTD'],
        compare: true
      });
      window.Caption?.render('#global-caption', {
        asOf: new Date(),
        insight: window.PageInsight || ''
      });
    });
  </script>
</body></html>
