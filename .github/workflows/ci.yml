name: CI

on:
  pull_request:
    paths:
      - 'shared/**'
      - 'src/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - '**/*.html'
      - 'scripts/**'
      - '.storybook/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'vitest.setup.ts'
  push:
    branches: [ main ]
    paths:
      - 'shared/**'
      - 'src/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - '**/*.html'
      - 'scripts/**'
      - '.storybook/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'vitest.setup.ts'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Stylelint
        run: npm run lint:css
      - name: HTMLHint
        run: npm run lint:html
      - name: Brand check
        run: npm run brand-check
      - name: TypeScript build
        run: npm run build:ts
      - name: Unit tests
        run: npm run test:unit
      - name: Storybook build
        run: npm run storybook:build
      - name: Visual regression tests
        run: npm run test
