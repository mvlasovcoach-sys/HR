name: CI

on:
  pull_request:
    paths:
      - 'shared/**'
      - '**/*.html'
      - 'scripts/**'
      - '!assets/css/**'
  push:
    branches: [ main ]
    paths:
      - 'shared/**'
      - '**/*.html'
      - 'scripts/**'
      - '!assets/css/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Brand check
        continue-on-error: true
        run: |
          npm ci
          npm run brand-check
      - name: Stylelint
        run: npm run lint:css
      - name: HTMLHint
        run: npm run lint:html
