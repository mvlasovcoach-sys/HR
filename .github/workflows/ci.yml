name: CI

on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - '**/*.html'
      - 'scripts/**'
      - '!assets/css/**'
  pull_request:
    paths:
      - 'shared/**'
      - '**/*.html'
      - 'scripts/**'
      - '!assets/css/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npx playwright install --with-deps
      - run: npm run lint:css
      - run: npm run lint:html
      - name: Brand check
        run: npm run brand-check
        continue-on-error: true
      - run: npm run test
